name: Import TourAPI data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build baseline
        run: npm run build

      - name: Test baseline
        run: npm test

      - name: Import pilot data
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          TOUR_API_MAX_PAGES: '1'
          TOUR_API_ROWS_PER_PAGE: '20'
          TOUR_API_ARRANGE: 'C'
        run: npm run import:tourapi

      - name: Audit imported data
        run: npm run audit:tourapi

      - name: Enrich balanced pilot candidates
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          TOUR_API_ENRICH_PER_REGION: '12'
        run: npm run enrich:tourapi

      - name: Enrich barrier-free pilot candidates
        env:
          TOUR_API_KEY2: ${{ secrets.TOUR_API_KEY2 }}
          BARRIERFREE_PER_REGION: '12'
        run: npm run enrich:barrierfree

      - name: Build imported data
        run: npm run build

      - name: Prepare import branch
        run: |
          if [ -z "$(git status --porcelain -- data/places.json data/tourapi-quality-report.json data/tourapi-enrichment-report.json data/barrierfree-enrichment-report.json)" ]; then
            echo "TourAPI import produced no data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C data/tourapi-import-result
          git add data/places.json data/tourapi-quality-report.json data/tourapi-enrichment-report.json data/barrierfree-enrichment-report.json
          git commit -m "Import audit and enrich TourAPI pilot data"
          git push --force origin data/tourapi-import-result

      - name: Summary
        run: |
          echo "### TourAPI import" >> "$GITHUB_STEP_SUMMARY"
          echo "- General source: Korea Tourism Organization KorService2" >> "$GITHUB_STEP_SUMMARY"
          echo "- Barrier-free source: Korea Tourism Organization KorWithService2/detailWithTour2" >> "$GITHUB_STEP_SUMMARY"
          echo "- Baseline build and application tests run before replacing data" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pilot uses modified-date order instead of alphabetical order" >> "$GITHUB_STEP_SUMMARY"
          echo "- Korea-outside coordinates are nulled before storage" >> "$GITHUB_STEP_SUMMARY"
          echo "- Quality report separates recommendation candidates, courses, facilities, and source-only records" >> "$GITHUB_STEP_SUMMARY"
          echo "- General detail pilot enriches up to 12 recommendation candidates per region (max 72)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Barrier-free pilot checks the same candidates using repository secret TOUR_API_KEY2" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reports only; production place records are not auto-filled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result branch: data/tourapi-import-result" >> "$GITHUB_STEP_SUMMARY"
          echo "- No production merge/deploy is performed by this workflow." >> "$GITHUB_STEP_SUMMARY"

name: Restore exact MVP source

on:
  push:
    paths:
      - 'pyeonhanga-mvp.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact source from ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pyeonhanga
          mkdir -p /tmp/pyeonhanga
          unzip -q pyeonhanga-mvp.zip -d /tmp/pyeonhanga

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            /tmp/pyeonhanga/ ./

          rm -rf dist

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Restore exact Codex MVP source"
          git push origin HEAD:main
